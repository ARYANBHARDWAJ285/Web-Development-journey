<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collapse border</title>
    <!-- using inline CSS -->
    <style>
        table,
        th,
        td {
            border: 1px solid purple ;
            border-collapse: collapse ;
        }
        th ,
        td {
            padding: 20px;
        }
        th {
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>My Custom Table{ Collapse border }</h1>
    <table style="width: 400px;">
        <!-- <table border="1px"> Wcan also used that  -->
        <tr>
            <th>Name </th>
            <th>Section</th>
            <th>Class</th>
        </tr>

        <tr>
            <td>Arun</td>
            <td>B</td>
            <td>A9</td>
        </tr>

        <tr>
            <td>Ankit</td>
            <td>C</td>
            <td>B2</td>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>A</td>
            <td>A1</td>
        </tr>
    </table>
</body>

</html>
