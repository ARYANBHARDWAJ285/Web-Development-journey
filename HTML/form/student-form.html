<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form </title>
    <style>
        .name-details label{
            display: inline-block;
            width: 160px;
            font-weight: bold;
        }

    </style>
</head>

<body>
    <form action="">

        <div  class="name-details">
            <label for="studentname">Enter Student Name :</label>
            <input type="text" name="studentname" id="studentname" ><br>
            <label for="fathername">Enter Father  Name : </label>
            <input type="text" name="fathername"  id="fathername" ><br>
            <label for="mothername">Enter Mother Name :</label>
            <input type="text" name="mothername" id="mothername">
        </div>

        <div>
            <fieldset>
                <legend>Select Gender : </legend>
                <input type="radio" name="selectgender" id="male" value="male" required>
                <label for="selectmale">Male</label>
                <input type="radio" name="selectgender" id="female" value="female" required>
                <label for="female">Female</label>
                <input type="radio"  name="selectgender" id="other" value="other" required>
                <label for="other">Other</label>
            </fieldset>
            
        </div>

        <div>
            <label for="classdetails">Select Class : </label>
            <select name="studentclass" id="classdetails" required>
                <option value="" disabled selected>-- Choose a class --</option>
                <option value="VI">Class VI</option>
                <option value="VII">Class VII</option>
                <option value="VIII">Class VIII</option>
            </select>
        </div>

        <div>
            <label for="feedback">Feedback</label><br>
            <textarea name="feedback" id="feedback"  rows="4" cols="30" ></textarea>
        </div>

        <input type="submit" value="Submit">

    </form>
</body>

</html>
