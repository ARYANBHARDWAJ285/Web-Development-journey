<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aryan Bhardwaj </title>
</head>

<body>


<!-- Event  Registration Form -->

    <h2>Event Registration</h2>
    <form>
        <label for="name">Enter Your Name :</label><br>
        <input type="text" id="name">

        <br><br>
        <label for="contactEmail">Enter Your Email :</label><br>
        <input type="email" id="contactEmail">
        <br><br>

        <label for="ContactDetails">Enter Your Phone Number :</label><br>
        <input type="text" id="ContactDetails">
        <br><br>

        <label for="occupationDetails">choose Occupation</label><br>
        <select name="Occupation" id="occupationDetails">
            <option value="Gamer">Gamer</option>
            <option value="Teacher">Teacher</option>
            <option value="software_engineer">Software Engineer</option>
        </select>

        <br><br>

        <legend>Select Language </legend>
        <input type="radio" id="codingLanguagepython" name="Language">
        <label for="codingLanguagepython">Python</label>

        <input type="radio" id="codingLanguagec++" name="Language">
        <label for="codingLanguagec++">C++</label>

        <input type="radio" id="codingLanguagejava" name="Language">
        <label for="codingLanguagejava">JAVA</label>

        <br><br>
        <label for="Comment">Comment : </label><br>
        <textarea name="commentFeedback" id="Comment" cols="25" rows="5"></textarea>

    </form>
</body>
</html>
