<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="grid.css">
</head>

<body>

    <header>
        <h1>Welcome to Grid File</h1>
        <p>How Many Language You Know</p>
    </header>

    <main>

        <div class="grid">

                <div class="item-lang">English</div>

                </div>
            </div>

            <div class="item">
                <div class="item-lang">Hindi</div>

                <div class="buttons">
                    <button class="btn-first">Know</button>

                </div>
            </div>

            <div class="item">
                <div class="item-lang">German</div>

                <div class="buttons">
                    <button class="btn-first">Know</button>
                    <button class="btn-second">Don't Know</button>
                </div>
            </div>

            <div class="item">
                <div class="item-lang">Chinese</div>

                <div class="buttons">
                    <button class="btn-first">Know</button>
                    <button class="btn-second">Don't Know</button>
                </div>
            </div>

            <div class="item">
                <div class="item-lang">Russian</div>

                <div class="buttons">
                    <button class="btn-first">Know</button>
                    <button class="btn-second">Don't Know</button>
                </div>
            </div>

            <div class="item">

                <div class="buttons">

                    <button class="btn-second">Don't Know</button>
                </div>
            </div>

        </div>

    </main>

</body>

</html>
